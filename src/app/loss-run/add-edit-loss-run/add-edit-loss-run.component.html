
<div class="container">
    <div *ngIf ="!showFiv">
        <h5>File Size is  Big sow it will take some time to Upload</h5>
        <app-spinner></app-spinner>
      </div>
   <h4 style="text-align: center;"> Account Name  : {{accountName}}</h4>
   <div class="card mt-2">
   
    <div class="container-fluid " *ngIf ="showFiv">
    
 
       
         <form [formGroup]="addEditAttachmentForm"> 
             <div class="row">
                <div class="mt-2"> 
                    <label>Policy Status</label>
                    <select class="form-select mt-1" formControlName="AttachedBy">
                     <option value="Our">Our</option>
                     <option value="Other">Other</option>
                   </select>
                  </div>
                <div class="mt-2"> 
                    <label> Policy Type</label>
                    <select class="form-select mt-1" formControlName="PolicyType">
                     <option value="PKG - (AL,APD,MTC)">PKG - (AL,APD,MTC)</option>
                     <option value="AL">AL</option>
                     <option value="PD">PD</option>
                     <option value="MTC">MTC</option>
                     <option value="GL">GL</option>
                     <option value="AL&MTC">AL&MTC</option>
                     <option value="AL&PD">AL&PD</option>
                     <option value="AL&GL">AL&GL</option>
                     <option value="GL&MTC">GL&MTC</option>
                     <option value="PD&MTC">PD&MTC</option>
                     <option value="GL&PD">GL&PD</option>
                    
                   </select>
                  </div>
             
          
                  
                 <div class="col-sm-12 mt-3">
                     <label>Upload file here</label>
                     <div class=" file-container center  text-center mt-2" >
                         
                        <label>Upload file here</label>
                        <input
                        type="file"
                        class="file"
                        placeholder="File Name"
                        multiple
                        accept=".xlsx,.xls,image/*,.doc, .docx,.ppt, .pptx,.txt,.pdf,.wav"
                        
                        (change)= "onFileUpload($event)"  [ngClass]= "{ 'is-invalid': submit && f['abc'].errors }" />
                        <div *ngIf ="submit && f['abc'].errors" class="invalid-feedback">
                            <div *ngIf ="f['abc'].errors">FIle is required</div>
                        </div>
                        <label>Upload file here</label>
                    </div>
                    <div *ngIf ="files">
                       File selected 
                     
                    </div>
                 </div>
                  
                    
             <div >
               
              
             </div>
             <div class="mt-3 mb-3"> 
                 <label>Description</label>
                 <input type="text" class="form-control mt-2"   formControlName ="Description">
              
             </div>

            
                     
               
             </div>
         
            
         </form>
      
    
        <div class="text-center mt-4 mb-4">
         <div >
           <button type="button" class="btn btn-outline-success btn-lg" style="width: 120px;"(click)="onSubmit()" > Save</button>
           <button type="button" class="btn btn-outline-danger btn-lg" style="width: 120px;margin-left: 10px;" mat-dialog-close>Clear</button>
             
            
           
           </div>
       </div>
     
         <!-- <div class="text-center mt-5 mb-5">
             <div class="btn-group  gap-2  " >
                
                 <button mat-stroked-button class="text-right" (click)="onSubmit()">Save</button>
                 <button mat-stroked-button class="text-right" color="warn" mat-button mat-dialog-close>Clear</button>
                
               
               </div>
         </div> -->
     
     </div>
   </div>

</div>
