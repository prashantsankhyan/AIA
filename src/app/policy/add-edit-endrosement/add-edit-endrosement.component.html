<div class="container-fluid">
  
 <div class="card mt-2">
  <div  class="card-header" style="background-color: #17a0bc; color: white;">
      <a href="javascript:void(0)" style=" color: white;text-decoration: dashed;" > Add Endorsement </a>  
    </div>
</div>
     <form [formGroup]="addEndorsementForm">
 
       <div class="row">
           <div class="col-sm-12 mt-2">
            <div class="form-floating mb-2">
              <input type="text" class="form-control mt-1"id="floatingEffectiveDateChange" placeholder="EffectiveDateChange" formControlName ='EffectiveDateChange'[(ngModel)] ="EffectiveDateChange" bsDatepicker  [ngClass]= "{ 'is-invalid': submit && f['EffectiveDateChange'].errors }">
              <div *ngIf ="submit && f['EffectiveDateChange'].errors" class="invalid-feedback">
                  <div *ngIf ="f['EffectiveDateChange'].errors">EffectiveDateChange  is required</div>
                  </div>  
                  <label for ="floatingEffectiveDateChange">Effective date Change</label>
            </div>
              
              
           </div>
           <div class="col-sm-12">
            <div class="form-floating mb-2">
              <select class="form-select formControl "id="floatingEndorsementType" aria-label="Default select example" formControlName ='EndorsementType'  [ngClass]= "{ 'is-invalid': submit && f['EndorsementType'].errors }" >
                <option hidden value="" disabled selected  > Select Type </option>
                <option  value="Driver">Driver</option>
                <option  value="Truck">Truck</option>
                <option  value="Trailer">Trailer</option>
                <option  value="Other">Other</option>
                
                
              </select>
              <div *ngIf ="submit && f['EndorsementType'].errors" class="invalid-feedback">
                <div *ngIf ="f['EndorsementType'].errors">Select Tyoe  is required</div>
                </div>  
                <label for="floatingEndorsementType">Select Type</label> 
            </div>
             
              
           </div>
                <div class="col-sm-12 ">
                  <div class="form-floating mb-2">
                  
                    <textarea class="form-control"id="floatingDescription" style="height: 120px"formControlName ='Description' placeholder="Description" [ngClass]= "{ 'is-invalid': submit && f['Description'].errors }" rows="3"></textarea>
                  
                    <div *ngIf ="submit && f['Description'].errors" class="invalid-feedback">
                       <div *ngIf ="f['Description'].errors">Description  is required</div>
                       </div> 
                       <label for ="floatingDescription">Description</label>
                  </div>
                     
                   </div>
                <div class="col-sm-12">
                  <div class="form-floating mb-2">
                    <select class="form-select formControl mt-1" id="floatingCode"  aria-label="Default select example" formControlName ='Code'  [ngClass]= "{ 'is-invalid': submit && f['Code'].errors }" >
                      <option hidden value="" disabled selected  > Select Code </option>
                      <option  value="CHGE">CHGE</option>
                      
                      
                    </select>
                    <div *ngIf ="submit && f['Code'].errors" class="invalid-feedback">
                      <div *ngIf ="f['Code'].errors">Code  is required</div>
                      </div> 
                      <label for="floatingCode">Code</label>
                  </div>
                   
                      
                </div>
               
                
       </div>
           
  
   <div style="text-align: right;" class="mt-5">
     <div  *ngIf ="messageSuccess">

      <div  *ngIf ="messageSuccess">
        <a href="javascript:void(0)"  (click)="onSubmit();" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm me-2"><i class="fas fa-check fa-sm text-white-50"></i>{{ID == undefined? ' Add':'Edit'}} Endrosement</a>
        <a href="javascript:void(0)"  class="d-none d-sm-inline-block btn btn-sm btn-danger shadow-sm"  mat-dialog-close><i class="fas fa-times fa-sm text-white-50"></i> Cancel</a>
      
      </div>
      
         
        
       
       </div>
   </div>
      
   
      </form>
 
 

</div>
