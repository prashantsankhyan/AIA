<div class="stage-dialog">

  <!-- ================= HEADER ================= -->
  <div class="stage-header">

    <div class="stage-header-icon">
      <i class="bi bi-flag-fill"></i>
    </div>

    <div class="stage-header-content">
      <h2>Enter Stage</h2>
      <span>Select the current stage for this record</span>
    </div>

    <button
      type="button"
      class="stage-close-btn"
      mat-dialog-close
      aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>

  </div>


  <!-- ================= BODY ================= -->
  <div class="stage-body">

    <form [formGroup]="updateForm">

      <div class="stage-field">

        <label for="stageType">
          <span>Stage</span>
          <span class="required">*</span>
        </label>

        <div class="stage-input-wrapper">

          <i class="bi bi-list-check stage-input-icon"></i>

          <select
            id="stageType"
            class="form-select stage-select"
            formControlName="StageType"
            [ngClass]="{
              'is-invalid': submit && f['StageType'].errors
            }">

            <option value="" disabled>
              Select Stage
            </option>

            <option value="Issue">
              Issue
            </option>

            <option value="Submit">
              Submit
            </option>

          </select>

        </div>


        <!-- Validation -->
        <div
          *ngIf="submit && f['StageType'].errors"
          class="stage-validation">

          <i class="bi bi-exclamation-circle"></i>

          <span>
            Stage is required
          </span>

        </div>

      </div>


      <!-- ================= SELECTED STAGE ================= -->
      <div
        class="selected-stage"
        *ngIf="updateForm.get('StageType')?.value">

        <div class="selected-stage-icon">
          <i class="bi bi-check-circle-fill"></i>
        </div>

        <div class="selected-stage-content">

          <span>
            Selected Stage
          </span>

          <strong>
            {{ updateForm.get('StageType')?.value }}
          </strong>

        </div>

      </div>


      <!-- ================= EMPTY MESSAGE ================= -->
      <div
        class="stage-info"
        *ngIf="!updateForm.get('StageType')?.value">

        <div class="stage-info-icon">
          <i class="bi bi-info-circle-fill"></i>
        </div>

        <div class="stage-info-content">

          <span>
            Stage Status
          </span>

          <strong>
            Please select a stage to continue.
          </strong>

        </div>

      </div>

    </form>

  </div>


  <!-- ================= FOOTER ================= -->
  <div class="stage-footer" *ngIf="messageSuccess">

    <button
      type="button"
      class="stage-clear-btn"
      mat-dialog-close>

      <i class="bi bi-x-circle"></i>

      <span>
        Clear
      </span>

    </button>


    <button
      type="button"
      class="stage-save-btn"
      (click)="onSubmit()">

      <i class="bi bi-check2-circle"></i>

      <span>
        Save
      </span>

    </button>

  </div>

</div>
