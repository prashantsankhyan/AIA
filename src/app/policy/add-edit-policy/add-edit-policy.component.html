
<div class="policy-page">

  <!-- =========================================================
       PAGE HEADER
       ========================================================= -->
  <div class="policy-header">

    <div class="header-content">
      <h2 class="policy-title">
        <i class="fas fa-file-contract"></i>
        {{ ChildPolicyID == '0' ? 'ADD POLICY' : 'EDIT POLICY' }}
      </h2>
<!-- 
      <p class="policy-subtitle">
        Enter Full Details
      </p> -->
    </div>

    <!-- <div class="policy-status">
      <span class="status-dot"></span>
      POLICY INFO
    </div> -->

  </div>


  <!-- =========================================================
       MAIN CARD
       ========================================================= -->
  <section class="policy-card">

    <form [formGroup]="addEditPolicyForm">

      <!-- =====================================================
           POLICY DETAILS
           ===================================================== -->
      <div class="form-section">

        <div class="section-header">

          <div class="section-icon">
            <i class="fas fa-file-alt"></i>
          </div>

          <div  style="text-transform: uppercase;">
            <h3 >Policy Details</h3>
            <p>
              Select the marketed policy and enter basic policy information.
            </p>
          </div>

        </div>


        <div class="row g-3">

          <!-- MARKETED POLICY -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingMarkedPolicyID" style="text-transform: uppercase;">
                Select Marketed
              </label>

              <div class="input-wrapper">

                <i class="fas fa-bullhorn field-icon"></i>

                <select
                  class="form-select modern-select"
                  id="floatingMarkedPolicyID"
                  formControlName="MarkedPolicyID"
                  [(ngModel)]="MarkedPolicyID"
                  (change)="getEffectiveDateAndExpireDateOfMarkedPolicyId()">

                  <option hidden value="" disabled>
                    Select Marketed
                  </option>

                  <ng-container
                    *ngIf="listOfMarkedPolicy.length > 0; else noDataFound">

                    <ng-container
                      *ngFor="let dataOfLineName of listOfMarkedPolicy">

                      <option
                        [value]="dataOfLineName.MarkedPolicyID"
                        [disabled]="
                          !dataOfLineName.AllFieldsFill ||
                          dataOfLineName.DeletedChildPolicy === 'ChildPolicy_Deleted'
                        "
                        [ngClass]="{
                          'text-danger':
                            !dataOfLineName.AllFieldsFill ||
                            dataOfLineName.DeletedChildPolicy === 'ChildPolicy_Deleted'
                        }">

                        {{ dataOfLineName.LineName }}
                        -
                        {{ dataOfLineName.LineShortName }}
                        -
                        {{ dataOfLineName.Effective | date:'MM-dd-yyyy' }}
                        -
                        {{ dataOfLineName.Expiration | date:'MM-dd-yyyy' }}

                      </option>

                    </ng-container>

                  </ng-container>

                  <ng-template #noDataFound>
                    <option disabled>
                      No data found
                    </option>
                  </ng-template>

                </select>

              </div>

            </div>

          </div>


          <!-- EFFECTIVE DATE -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingEffective" style="text-transform: uppercase;">
                Effective Date
              </label>

              <div class="input-wrapper">

                <i class="fas fa-calendar-alt field-icon"></i>

                <input
                  type="text"
                  class="form-control modern-input"
                  id="floatingEffective"
                  formControlName="Effective"
                  [(ngModel)]="Effective"
                  (ngModelChange)="changeNextDate()"
                  placeholder="MM-DD-YYYY">

              </div>

            </div>

          </div>


          <!-- EXPIRATION DATE -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingExpiration" style="text-transform: uppercase;">
                Expiration Date
              </label>

              <div class="input-wrapper">

                <i class="fas fa-calendar-check field-icon"></i>

                <input
                  type="text"
                  class="form-control modern-input"
                  id="floatingExpiration"
                  formControlName="Expiration"
                  [(ngModel)]="Expiration"
                  placeholder="MM-DD-YYYY">

              </div>

            </div>

          </div>


          <!-- DESCRIPTION -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingDescription" style="text-transform: uppercase;">
                Description
              </label>

              <div class="input-wrapper">

                <i class="fas fa-tags field-icon"></i>

                <select
                  class="form-select modern-select"
                  id="floatingDescription"
                  formControlName="Description">

                  <option hidden value="" disabled>
                    Select Description
                  </option>

                  <option value="AL">AL</option>
                  <option value="APD">APD</option>
                  <option value="MTC">MTC</option>
                  <option value="GL">GL</option>
                  <option value="Cont.Liability">Cont. Liability</option>
                  <option value="Cont.Cargo">Cont. Cargo</option>
                  <option value="XS">XS</option>
                  <option value="AL-APD-MTC-GL">AL, APD, MTC, GL</option>
                  <option value="AL-APD-MTC">AL, APD, MTC</option>
                  <option value="AL-APD">AL - APD</option>
                  <option value="AL-MTC">AL - MTC</option>
                  <option value="AL-MTC-GL">AL - MTC - GL</option>
                  <option value="APD-MTC">APD - MTC</option>
                  <option value="AL-GL">AL - GL</option>
                  <option value="NTL">NTL</option>
                  <option value="NTL-APD">NTL - APD</option>
                  <option value="MTC-GL">MTC - GL</option>
                  <option value="Cont.XS">Cont. XS</option>
                  <option value="Umbrella">Umbrella</option>

                </select>

              </div>

            </div>

          </div>


          <!-- POLICY -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingChildPolicyName" style="text-transform: uppercase;">
                Policy
              </label>

              <div class="input-wrapper">

                <i class="fas fa-file-signature field-icon"></i>

                <input
                  type="text"
                  class="form-control modern-input"
                  id="floatingChildPolicyName"
                  formControlName="ChildPolicyName"
                  placeholder="Enter Policy">

              </div>

            </div>

          </div>


          <!-- SOURCE -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingSource" style="text-transform: uppercase;">
                Source
              </label>

              <div class="input-wrapper">

                <i class="fas fa-globe field-icon"></i>

                <select
                  class="form-select modern-select"
                  id="floatingSource"
                  formControlName="Source">

                  <option hidden value="" disabled>
                    Select Source
                  </option>

                  <option value="Facebook">Facebook</option>
                  <option value="Newspaper">Newspaper</option>
                  <option value="Call In">Call In</option>
                  <option value="TV">TV</option>

                </select>

              </div>

            </div>

          </div>

        </div>

      </div>


      <!-- =====================================================
           BILLING / COMPANY DETAILS
           ===================================================== -->
      <div class="form-section second-section">

        <div class="section-header">

          <div class="section-icon">
            <i class="fas fa-building"></i>
          </div>

          <div style="text-transform: uppercase;">
            <h3>Billing &amp; Company Details</h3>
            <p>
              Select the broker, issuing company and billing type.
            </p>
          </div>

        </div>


        <div class="row g-3">

          <!-- BROKER -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingBrokerID" style="text-transform: uppercase;">
                Select Broker
              </label>

              <div class="input-wrapper">

                <i class="fas fa-user-tie field-icon"></i>

                <select
                  class="form-select modern-select"
                  id="floatingBrokerID"
                  formControlName="BrokerID">

                  <option hidden value="" disabled>
                    Select Broker
                  </option>

                  <option
                    *ngFor="let data of listOfBroker"
                    [value]="data.BrokerID">

                    {{ data.AccountName }}

                  </option>

                </select>

              </div>

            </div>

          </div>


          <!-- ISSUING COMPANY -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingIssuingCompany" style="text-transform: uppercase;">
                Issuing Company
              </label>

              <div class="input-wrapper">

                <i class="fas fa-building field-icon"></i>

                <select
                  class="form-select modern-select"
                  id="floatingIssuingCompany"
                  formControlName="IssuingCompany">

                  <option hidden value="" disabled>
                    Select Issuing Company
                  </option>

                  <ng-container
                    *ngFor="let data of listOfAllCarrier">

                    <option
                      *ngIf="!data.IsDeleted"
                      [value]="data.ID">

                      {{ data.CarrierName }}

                    </option>

                  </ng-container>

                </select>

              </div>

            </div>

          </div>


          <!-- BILL TYPE -->
          <div class="col-xl-4 col-lg-6 col-md-6">

            <div class="modern-field">

              <label for="floatingBillType" style="text-transform: uppercase;">
                Bill Type
              </label>

              <div class="input-wrapper">

                <i class="fas fa-receipt field-icon"></i>

                <select
                  class="form-select modern-select"
                  id="floatingBillType"
                  formControlName="BillType">

                  <option hidden value="" disabled>
                    Select Bill Type
                  </option>

                  <option value="Direct Bill">
                    Direct Bill
                  </option>

                  <option value="Agency Bill">
                    Agency Bill
                  </option>

                </select>

              </div>

            </div>

          </div>

        </div>

      </div>


      <!-- =====================================================
           ACTION BAR
           ===================================================== -->
      <div class="policy-actions">

        <div class="action-message">

          <span *ngIf="messageSuccess">
            <i class="fas fa-check-circle"></i>
            All information is ready to save.
          </span>

        </div>


        <div
          class="action-buttons" 
          *ngIf="messageSuccess" style="text-transform: uppercase;">

          <button
            type="button"
            class="btn-save"
            (click)="onSubmit()" style="text-transform: uppercase;">

            <i class="fas fa-check"></i>

            {{ ChildPolicyID == '0' ? 'Add Policy' : 'Update Policy' }}

          </button>


          <button
            type="button"
            class="btn-cancel" style="text-transform: uppercase;"
            mat-dialog-close>

            <i class="fas fa-times"></i>

            Cancel

          </button>

        </div>

      </div>

    </form>

  </section>

</div>
