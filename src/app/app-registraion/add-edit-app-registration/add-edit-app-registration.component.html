<div class="container-fluid">
 <h4 style="text-align: center;color: rgba(0, 0, 255, 0.541);">Add Login Detail</h4>
 <div  class=" " >
  <section class="registration backgroundPage">
  
   <form [formGroup]="addEditRegistrationForm">
    <div class="col-sm-12">
     <label>Select Team</label>
     <select  aria-label="Default select example" formControlName="AccountID" class="form-control" (change)="onAccountSelect($event)"  >
         <option hidden value="" disabled selected  > Select Team</option>
         <option *ngFor ="let data of listOfAllInsuredData" [value]="data.AccountID">{{data.AccountName}}</option>
         
       
     </select>
    
   </div>
      <div class="col-sm-12">
          <label style="text-align: center;">User Name</label>
          <input type="text" class="form-control"   [(ngModel)] ="selectedEmail"formControlName="UserName" >
       
      </div>
    
    
      
     <div class="col-sm-12">
      <label>Passward</label>
      <input type="text" formControlName="Password" class="form-control" >
    
    </div>
    
 
    
     
     
   
     
    
    
     
      
      
      
 
  
      <div class="text-center mt-4 mb-4">
 
       <div  >
         <button type="button" style="width: 130px;" class="btn btn-outline-success" (click)="onSubmit()">Save</button>
         <button type="button" style="width: 130px; margin-left: 5px;" class="btn btn-outline-danger "mat-dialog-close>Cancle</button>
         
        
     
           
          
         
         </div>
      
     </div>
    
    
  </form>
 
  </section>
</div>

</div>
