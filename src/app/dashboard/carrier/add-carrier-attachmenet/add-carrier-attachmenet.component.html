<h3 mat-dialog-title class="text-center">
  Carrier : {{ accountName }}
</h3>

<!-- Spinner -->
<div *ngIf="!showFiv" class="text-center p-3">
  <h5>File Size is Big so it will take some time to Upload</h5>
  <app-spinner></app-spinner>
</div>

<form [formGroup]="addEditAttachmentForm" *ngIf="showFiv">

  <!-- 🔽 SCROLLABLE FORM BODY -->
  <mat-dialog-content class="dialog-content mt-1">

    <div class="col-sm-12"> <label>Upload file here</label>
         <div class=" file-container center text-center" > <label>Upload file here</label>
             <input type="file" class="file" placeholder="File Name" multiple accept=".xlsx,.xls,image/*,.doc, .docx,.ppt, .pptx,.txt,.pdf,.wav" (change)= "onFileUpload($event)" [ngClass]= "{ 'is-invalid': submit && f['abc'].errors }" />
              <div *ngIf ="submit && f['abc'].errors" class="invalid-feedback"> <div *ngIf ="f['abc'].errors">FIle is required</div> 
            </div> <label>Upload file here</label> </div> </div> <div *ngIf ="files"> {{files.name}} </div>

    <!-- Binding -->
    <div class="mt-2">
      <label> Agency Earned & Unearned Commissions</label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="AgencyEarned">
          <mat-option
            value="Agency Earned & Unearned Commissions">
            Agency Earned & Unearned Commissions
          </mat-option>
         
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Policies -->
    <div>
      <label>Agency Statement</label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="AgencyStatement">
          <mat-option value="Agency Statement">Agency Statement</mat-option>
         
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Proposal -->
   <div class="compact-field">
  <label>How to make Payment</label>
  <mat-form-field appearance="outline" class="w-100">
    <mat-select formControlName="HowToMakePayment">
      <mat-option value="How to make Payment">
       How to make Payment
      </mat-option>
     
    </mat-select>
  </mat-form-field>
</div>


  <div >
      <label>Payments</label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="Payments">
          <mat-option value="Payments">
           Payments
          </mat-option>
        
        </mat-select>
      </mat-form-field>
    </div>
    <div >
      <label>Documents</label>
      <mat-form-field appearance="outline" class="w-100">
        <mat-select formControlName="ParmjitDocuments">
          <mat-option value="Parmjit Dhami Documents">
           Parmjit Dhami Documents
          </mat-option>
          <mat-option value="Sandy Sidhu Documents">
           Sandy Sidhu Documents
          </mat-option>
        </mat-select>
       
      </mat-form-field>
      
    </div>

    

    

  
  </mat-dialog-content>

  <!-- 🔒 FIXED BUTTONS -->
  <mat-dialog-actions align="end" class="dialog-footer">

    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
    >
      <mat-icon>upload</mat-icon>
      Upload Data
    </button>

    <button
      mat-raised-button
      color="warn"
      mat-dialog-close
    >
      Cancel
    </button>

  </mat-dialog-actions>

</form>
