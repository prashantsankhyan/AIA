
<div *ngIf ="showSpiner">
 <app-spinner></app-spinner>
</div>
<div *ngIf ="!showSpiner">
 <div class="card mt-3">
  <div class="row p-2">
    <div class="col-sm-3 ">
   <input
  type="text"
  class="form-control"
  placeholder="Search Broker"
  
  [(ngModel)]="searchText"
/>
     
   </div>
 
   <div class="col-sm-2">
    
   </div>
   <div class="col-sm-2">
   
  </div>
  <div class="col-sm-2 ">
    
  </div>
  <div class="col-sm-3" style="text-align: right;">
  
     <button class="btn" style="background-color: #1397d5;color: white;" (click)="addEditBroker($event)" ><span style="margin-left: 15px;margin-right: 15px;"> ADD BROKER </span></button>
   
  </div>
  </div>
</div>
 <div class="scrollable-table-body mt-3" >
   
     <table  class="table table-bordered">
    
       <thead>
         <tr>
           <th >Broker Name</th>
           <th>LookUpCode</th>
           
          
           <th>Address </th>
          
           <th>Website</th>
          
          <th ></th>
          <th ></th>
         
          
         </tr>
       </thead>
       <tbody>
       
        <ng-container *ngFor="let data of filteredBroker">
         <tr *ngIf="!data.IsDeleted"(click)="goToAttachment(data)">
           <td>{{data.AccountName}}</td>
           <td>{{data.LookUpCode}}</td>
           <td>{{data.Address1}}-{{data.City}}-{{data.StateCode}}-{{data.ZIP}}-{{data.PrimaryNumber}}</td>
          
           <td>{{data.WebsiteAddress}}</td>
           <td >
             <a style="color: red;" (click)="deleteBroker(data)">
               <i class="fa fa-trash fa-fw" aria-hidden="true"></i>
             </a>
            
           </td>
           <td> <a style="color: green;" (click)="addEditBroker(data)">
              <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
            </a>
          </td>
          
         </tr>
       </ng-container>
        
      
        
       </tbody>
      
     </table>
  
 </div>
 </div>
