<div class="container-fluid">

  <div *ngIf="!showFiv" class="text-center p-3">
    <h5>File Size is Big so it will take some time to Upload</h5>
    <app-spinner></app-spinner>
  </div>

  <form [formGroup]="addEditAttachmentForm" *ngIf="showFiv">

    <mat-dialog-content class="dialog-content mt-1">

      <!-- File Upload -->
      <div class="col-sm-12">
        <label class="form-label">
          Upload File <span class="required">*</span>
        </label>

        <div class="file-container center text-center">

          <input
            type="file"
            class="file"
            multiple
            accept=".xlsx,.xls,image/*,.doc,.docx,.ppt,.pptx,.txt,.pdf,.wav"
            (change)="onFileUpload($event)"
            [ngClass]="{
              'is-invalid': submit && f['abc'].errors
            }"
          />

          <label>Upload file here</label>

        </div>

        <div
          *ngIf="submit && f['abc'].errors"
          class="invalid-feedback d-block"
        >
          File is required
        </div>

        <div *ngIf="files" class="selected-file mt-1">
          {{ files.name }}
        </div>
      </div>


      <!-- Agency Document -->
     <div class="mt-3">

  <label class="form-label">
    Agency Document <span class="required">*</span>
  </label>

  <mat-form-field
    appearance="outline"
    class="w-100"
  >

    <mat-select
      formControlName="AgencyDocument"
      placeholder="Select Agency Document"
    >

      <!-- Search -->
      <mat-option>
        <ngx-mat-select-search
          [formControl]="agencyDocumentSearchCtrl"
          placeholderLabel="Search Agency Document..."
          noEntriesFoundLabel="No Agency Document found">
        </ngx-mat-select-search>
      </mat-option>

      <!-- Options -->
      <mat-option
        *ngFor="let doc of filteredAgencyDocuments"
        [value]="doc"
      >
        {{ doc }}
      </mat-option>

    </mat-select>

    <mat-error
      *ngIf="
        submit &&
        f['AgencyDocument'].hasError('required')
      "
    >
      Please select Agency Document
    </mat-error>

  </mat-form-field>

</div>


      <!-- Expense -->
    


      <!-- Description -->
      <div>

        <label class="form-label">
          Description <span class="required">*</span>
        </label>

        <mat-form-field appearance="outline" class="w-100">

          <textarea
            matInput
            formControlName="Description"
            rows="3"
            maxlength="500"
            placeholder="Enter description"
          ></textarea>

          <mat-hint align="end">
            {{ addEditAttachmentForm.get('Description')?.value?.length || 0 }}/500
          </mat-hint>

          <mat-error
            *ngIf="submit && f['Description'].hasError('required')"
          >
            Description is required
          </mat-error>

          <mat-error
            *ngIf="submit && f['Description'].hasError('minlength')"
          >
            Description must be at least 3 characters
          </mat-error>

        </mat-form-field>

      </div>

    </mat-dialog-content>


    <!-- Buttons -->
    <mat-dialog-actions align="end" class="dialog-footer">

      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onSubmit()"
      >
        <mat-icon>upload</mat-icon>
        Upload Data
      </button>

      <button
        mat-raised-button
        color="warn"
        type="button"
        mat-dialog-close
      >
        Cancel
      </button>

    </mat-dialog-actions>

  </form>

</div>
