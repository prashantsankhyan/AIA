<div *ngIf ="showSpiner">
Please wait data---
</div>
<div class="container" *ngIf ="!showSpiner">
  <div class="row mt-3" *ngFor="let carrier of listOfCarrier">

    <div class="col-sm-12">
      <div class="list-group">
        <a class="list-group-item list-group-item-action active"
           style="background-color: #17a0bc;">
          Broker Name
        </a>
        <a class="list-group-item list-group-item-action">
          {{ carrier.BrokerName || 'N/A' }}
        </a>
      </div>
    </div>

    <div class="col-sm-12 mt-3">
      <div class="list-group">
        <a class="list-group-item list-group-item-action active"
           style="background-color: #17a0bc;">
          Carrier Name
        </a>
        <a class="list-group-item list-group-item-action">
          {{ carrier.IssuingCompanyName || 'N/A' }}
        </a>
      </div>
    </div>

  </div>
</div>
