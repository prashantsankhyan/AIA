
<div class="container">
 <div *ngIf ="!showFiv">
     <h5>File Size is  Big sow it will take some time to Upload</h5>
     <app-spinner></app-spinner>
   </div>
   <h4 style="text-align: center;"> Account Name  : {{accountName}}</h4>
   <div class="card mt-2">
   
    <div class="container-fluid " *ngIf ="showFiv">
    
 
       
         <form [formGroup] ="addEditAttachmentForm"> 
             <div class="row">
               <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Finance Section</mat-label>
      <mat-select formControlName="PolicyType">
        <mat-option value="Initial Finance">Initial Finance</mat-option>
        <mat-option value="AP Finance">AP Finance</mat-option>
      </mat-select>
    </mat-form-field>
              <div class="mt-2"> 
               <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Endorsement Section</mat-label>
      <mat-select formControlName="TransactionType">
        <mat-option value="AL">AL</mat-option>
        <mat-option value="PD">PD</mat-option>
        <mat-option value="MTC">MTC</mat-option>
        <mat-option value="GL">GL</mat-option>
        <mat-option value="AL&PD">AL & PD</mat-option>
        <mat-option value="PD&MTC">PD & MTC</mat-option>
        <mat-option value="AL&PD&MTC">AL & PD & MTC</mat-option>
      </mat-select>
    </mat-form-field>
             </div>
          
                  
                 <div class="col-sm-12 mt-3">
                     <label>Upload file here</label>
                     <div class=" file-container center  text-center mt-2" >
                         
                        <label>Upload file here</label>
                        <input
                        type="file"
                        class="file"
                        placeholder="File Name"
                        multiple
                        accept=".xlsx,.xls,image/*,.doc, .docx,.ppt, .pptx,.txt,.pdf,.wav"        
                        (change)= "onFileUpload($event)"  [ngClass]= "{ 'is-invalid': submit && f['abc'].errors }" />
                        <div *ngIf ="submit && f['abc'].errors" class="invalid-feedback">
                            <div *ngIf ="f['abc'].errors">FIle is required</div>
                        </div>
                        <label>Upload file here</label>
                    </div>
                 </div>
                  
                    
             <div *ngIf ="files">
                 {{files.name}}
              
             </div>
             <div class="mt-3 mb-3"> 
                 <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>AP Invoice Section</mat-label>
      <mat-select formControlName="Description">
        <mat-option value="AP Invoices">AP Invoices</mat-option>
          <mat-option value="Payment confirmation - (Parm Sir)">Payment confirmation - (Parm Sir)</mat-option>
      </mat-select>
    </mat-form-field>
                
             </div>


           

            
                     
               
             </div>
         
            
         </form>
      
    
        <div class="text-center mt-2 mb-2">
         <div >
         <!-- Buttons -->
  <div class="text-center mt-2 mb-2">
    <button
      mat-raised-button
      color="primary"
      style="width:120px"
      (click)="onSubmit()"
    >
      Save
    </button>

    <button
      mat-raised-button
      color="warn"
      style="width:120px; margin-left:10px"
      mat-dialog-close
    >
      Clear
    </button>
           
           </div>
       </div>
     
         <!-- <div class="text-center mt-5 mb-5">
             <div class="btn-group  gap-2  " >
                
                 <button mat-stroked-button class="text-right" (click)="onSubmit()">Save</button>
                 <button mat-stroked-button class="text-right" color="warn" mat-button mat-dialog-close>Clear</button>
                
               
               </div>
         </div> -->
     
     </div>
   </div>

</div>
