    <div class="current-time">
  {{ currentTime | date:'hh:mm:ss a' }}
</div>
   
<div class="login-container" *ngIf="messageSuccess">
  <h2>Welcome Team</h2>
  <form [formGroup]="confirmLogin" >
    <div class="input-field">
      <input type="text" formControlName="UserName" placeholder="Username" />
    </div>
    <div class="input-field">
      <input type="password" formControlName="Password" placeholder="Password"  (keydown)="onKeydown($event)"/>
    </div>
    <!-- <button type="submit" routerLink="/delete"> Forgot Password</button> -->
  </form>
  <!-- <div class="footer">
    Don't have an account? <a routerLink="/register">Register</a>
  </div> -->
</div>

<div class="🤚" *ngIf="waitingMessage">
    <img src="../../assets/wating.gif">
    </div>
